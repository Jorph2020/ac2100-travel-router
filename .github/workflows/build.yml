name: Build AC2100 travel router firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt release tag"
        required: false
        default: "v24.10.8"
      variant:
        description: "full = OpenClash; lite = no OpenClash, use ShellCrash"
        required: true
        type: choice
        default: "lite"
        options:
          - full
          - lite
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          sudo docker system prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev python3 \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget squashfs-tools

      - name: Cache OpenWrt downloads
        uses: actions/cache@v6
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ github.event.inputs.openwrt_version || 'v24.10.8' }}-${{ github.event.inputs.variant || 'lite' }}-${{ hashFiles('feeds.conf', 'config/ac2100.config', 'config/ac2100-lite.config') }}
          restore-keys: |
            openwrt-dl-${{ github.event.inputs.openwrt_version || 'v24.10.8' }}-

      - name: Build
        env:
          OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || 'v24.10.8' }}
          CONFIG_FILE: config/${{ github.event.inputs.variant == 'full' && 'ac2100.config' || 'ac2100-lite.config' }}
          JOBS: "4"
        run: ./scripts/build.sh

      - name: Verify firmware contents
        run: |
          set -o pipefail
          ./scripts/verify-image.sh 2>&1 | tee -a build.log

      - name: Preserve verify log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp build.log verify-last.log 2>/dev/null || true
          git add -f verify-last.log
          git commit -m "ci: preserve verify log [skip ci]" || true
          git push || true

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ac2100-travel-router-${{ github.event.inputs.variant || 'lite' }}-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/* \
            --title "AC2100 lite build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatic lite firmware build from ${GITHUB_SHA}. Flash the squashfs-sysupgrade.bin only." \
            --latest

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
