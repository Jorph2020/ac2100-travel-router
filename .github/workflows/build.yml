name: Build AC2100 travel router firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt release tag"
        required: false
        default: "v24.10.8"
      variant:
        description: "full = OpenClash; lite = no OpenClash, use ShellCrash"
        required: true
        type: choice
        default: "lite"
        options:
          - full
          - lite
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          sudo docker system prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev python3 \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ github.event.inputs.openwrt_version || 'v24.10.8' }}-${{ github.event.inputs.variant || 'lite' }}-${{ hashFiles('feeds.conf', 'config/ac2100.config', 'config/ac2100-lite.config') }}
          restore-keys: |
            openwrt-dl-${{ github.event.inputs.openwrt_version || 'v24.10.8' }}-

      - name: Build
        env:
          OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || 'v24.10.8' }}
          CONFIG_FILE: config/${{ github.event.inputs.variant == 'full' && 'ac2100.config' || 'ac2100-lite.config' }}
          JOBS: "4"
        run: ./scripts/build.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ac2100-travel-router-${{ github.event.inputs.variant || 'lite' }}-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
